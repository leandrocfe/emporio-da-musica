<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 32" width="72" height="32" role="img">
  <title>Lia está pensando</title>
  <style>
    .staff { stroke: hsl(230, 23%, 37%); stroke-opacity: 0.35; stroke-width: 0.8; }
    .note { fill: hsl(232, 100%, 59%); stroke: hsl(232, 100%, 59%); animation: bounce 1.4s ease-in-out infinite; }
    .n2 { animation-delay: 0.2s; }
    .n3 { animation-delay: 0.4s; }
    .stem { stroke-width: 1.4; stroke-linecap: round; }
    .head { stroke: none; }
    @keyframes bounce {
      0%, 55%, 100% { transform: translateY(0); }
      25% { transform: translateY(-5px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .note { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay: 0.4s; }
      .n3 { animation-delay: 0.8s; }
    }
  </style>
  <g class="staff">
    <line x1="2" y1="9" x2="70" y2="9"/>
    <line x1="2" y1="13" x2="70" y2="13"/>
    <line x1="2" y1="17" x2="70" y2="17"/>
    <line x1="2" y1="21" x2="70" y2="21"/>
    <line x1="2" y1="25" x2="70" y2="25"/>
  </g>
  <g class="note n1">
    <ellipse class="head" cx="16" cy="21" rx="3.6" ry="2.6" transform="rotate(-20 16 21)"/>
    <line class="stem" x1="19.1" y1="20.4" x2="19.1" y2="9"/>
  </g>
  <g class="note n2">
    <ellipse class="head" cx="36" cy="21" rx="3.6" ry="2.6" transform="rotate(-20 36 21)"/>
    <line class="stem" x1="39.1" y1="20.4" x2="39.1" y2="9"/>
  </g>
  <g class="note n3">
    <ellipse class="head" cx="56" cy="21" rx="3.6" ry="2.6" transform="rotate(-20 56 21)"/>
    <line class="stem" x1="59.1" y1="20.4" x2="59.1" y2="9"/>
  </g>
</svg>
