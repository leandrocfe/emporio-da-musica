[project]
name = "emporio-da-musica"
version = "0.1.0"
description = "Lia, assistente virtual de atendimento da Empório da Música"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chainlit>=2.12.0",
    "fastapi>=0.162.0",
    # Pinned to the patch line: LiteLLMClient relies on the private `_skip_mcp_handler`
    # kwarg because litellm needs mcp>=2 on the tools path while Chainlit pins mcp<2.
    "litellm>=1.106.6,<1.107",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emporio"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    # Third-party noise from litellm's pydantic models, not our code.
    "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
